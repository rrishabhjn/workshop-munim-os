steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--build-arg"
      - "VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}"
      - "--build-arg"
      - "VITE_SUPABASE_PUBLISHABLE_KEY=${_VITE_SUPABASE_PUBLISHABLE_KEY}"
      - "-t"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/workshop-munim/app:latest"
      - "."
images:
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/workshop-munim/app:latest"
